<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --success: #22c55e;
        --stroke: rgba(148, 163, 184, 0.25);
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(1200px 600px at 20% 20%, rgba(236, 72, 153, 0.08), transparent),
                    radial-gradient(1200px 600px at 80% 80%, rgba(34, 197, 94, 0.08), transparent),
                    var(--bg);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        color: var(--text);
      }
      .card {
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid var(--stroke);
        border-radius: 20px;
        padding: 2rem;
        width: 100%;
        max-width: 560px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(10px);
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.35);
      }
      .icon svg { width: 40px; height: 40px; color: var(--success); }
      h1 { margin: 0.5rem 0 0.75rem; font-size: 1.75rem; }
      p { margin: 0; color: var(--muted); font-size: 1rem; }
      .actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center; }
      .btn { padding: 0.75rem 1.25rem; border-radius: 10px; border: 1px solid var(--stroke); background: transparent; color: var(--text); text-decoration: none; font-weight: 600; }
      .btn.primary { background: var(--success); color: #0b141b; border: none; }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-live="polite">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 7L9 18L4 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Thank You</h1>
      <p>We have submitted your request and will get back to you soon.</p>
      <div class="actions">
        <a class="btn" href="services.html">Explore Services</a>
        <a class="btn primary" href="booking.html">Make Another Booking</a>
      </div>
    </main>
  </body>
</html>
